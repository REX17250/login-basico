<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login básico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <section id="auth-view">
      <h1 id="form-title">Iniciar sesión</h1>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required>
          <small id="pw-hint" class="hint" hidden>Entre 8 y 72 caracteres.</small>
        </div>
        <button type="submit" id="submit-btn" class="btn">Iniciar sesión</button>
      </form>
      <p class="switch">
        <span id="switch-text">¿No tienes cuenta?</span>
        <button type="button" id="toggle-btn" class="link">Crear cuenta</button>
      </p>
    </section>

    <section id="welcome-view" hidden>
      <h1>Hola, <span id="welcome-email"></span></h1>
      <button type="button" id="logout-btn" class="btn">Cerrar sesión</button>
    </section>

    <div id="message" class="message" role="alert"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
